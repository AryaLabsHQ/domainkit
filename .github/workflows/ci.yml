name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate package
        run: bun run release:check

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.10.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds every package first, so the gallery and the docs app resolve the shipped types.
      - name: Typecheck the snippet gallery
        run: bun run typecheck:examples

      - name: Check reference coverage
        run: bun run --filter @domainkit/docs reference:check

      - name: Typecheck the docs app
        run: bun run --filter @domainkit/docs typecheck

      - name: Check the snippet reader and the component previews
        run: bun run --filter @domainkit/docs test

      - name: Build the docs site
        run: bun run --filter @domainkit/docs build

      - name: Validate the registry manifest
        run: bun run --filter @domainkit/docs registry:validate

      # Installs every item into a scratch shadcn project and compiles it, so a broken item cannot
      # reach the published registry.
      - name: Check the registry consumers
        run: bun run --filter @domainkit/docs registry:check

      - name: Validate links
        run: ./node_modules/.bin/blume validate --strict
        working-directory: apps/docs

      - name: Audit the built site
        run: ./node_modules/.bin/blume audit --strict
        working-directory: apps/docs
