core:changelogs:
  - content: "---\npackages:\n  domainkit:\n    type: minor\n---\n\n## Expose callable constructors\n\nExpose callable constructors for tagged DomainKit values. Effect and Promise integrations can\ncreate plan operations, revocation states, and resolver outcomes without manually writing `_tag`\nfields, while schemas remain available for validation and persistence.\n"
    filename: domainkit-callable-constructors.md
    v: 0.0.0
  - content: "---\npackages:\n  \"@domainkit/react\":\n    type: patch\n---\n\n## Make no-op provisioning explicit\n\nMake provisioning review actions reflect no-op DNS plans and soften dialog focus styling.\n"
    filename: react-noop-plan-cta.md
    v: 0.0.0
